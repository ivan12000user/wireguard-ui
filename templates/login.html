<!DOCTYPE html>
<html>

<head>


    <!-- WGUI_THEME_BOOTSTRAP_V3 -->
    <meta name="color-scheme" content="dark light">
    <style id="wgui-early-dark">
      /* Anti-flash: как только на <html> появляется .dark-mode — сразу делаем базовые контейнеры тёмными,
         не дожидаясь wgui-theme.css / adminlte. */
      html.dark-mode, html.dark-mode body { background:#0f1115 !important; color:#e7eaf0 !important; }

      html.dark-mode .wrapper,
      html.dark-mode .content-wrapper,
      html.dark-mode .main-header,
      html.dark-mode .main-sidebar,
      html.dark-mode .navbar,
      html.dark-mode .main-footer {
        background:#0f1115 !important;
        color:#e7eaf0 !important;
      }

      html.dark-mode .card,
      html.dark-mode .card-body,
      html.dark-mode .card-header,
      html.dark-mode .card-footer,
      html.dark-mode .box,
      html.dark-mode .box-body,
      html.dark-mode .box-header,
      html.dark-mode .info-box,
      html.dark-mode .small-box {
        background:#121724 !important;
        color:#e7eaf0 !important;
        border-color: rgba(255,255,255,.08) !important;
      }

      html.dark-mode .table,
      html.dark-mode .table td,
      html.dark-mode .table th {
        color: rgba(255,255,255,.92) !important;
      }

      html.dark-mode .form-control,
      html.dark-mode input,
      html.dark-mode select,
      html.dark-mode textarea {
        background:#0f1115 !important;
        color: rgba(255,255,255,.92) !important;
        border-color: rgba(255,255,255,.14) !important;
      }

      html.dark-mode .dropdown-menu {
        background:#121724 !important;
        color:#e7eaf0 !important;
        border-color: rgba(255,255,255,.10) !important;
      }
    </style>

    <script>
    (function(){
      var KEY = "wgui_theme";

      function getCookie(name){
        try{
          var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()\\[\\]\\\\\\/\\+^])/g,'\\$1') + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : "";
        }catch(e){ return ""; }
      }
      function setCookie(name, value){
        try{
          document.cookie = name + "=" + encodeURIComponent(value) + "; Path=/; Max-Age=31536000; SameSite=Lax";
        }catch(e){}
      }
      function pickDefault(){
        try{
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return "dark";
        }catch(e){}
        return "light";
      }

      function readTheme(){
        var t = "";
        try { t = localStorage.getItem(KEY) || ""; } catch(e) {}
        if (!t) t = getCookie(KEY) || "";
        if (!t) t = pickDefault();
        return (t === "dark") ? "dark" : "light";
      }

      function applyTheme(t){
        var isDark = (t === "dark");
        var html = document.documentElement;
        html.classList.toggle("dark-mode", isDark);
        html.setAttribute("data-theme", isDark ? "dark" : "light");
        if (document.body){
          document.body.classList.toggle("dark-mode", isDark);
          document.body.setAttribute("data-theme", isDark ? "dark" : "light");
        }
        var ico = document.getElementById("wgui-theme-ico");
        if (ico) ico.textContent = isDark ? "🌙" : "☀️";
      }

      function setTheme(t){
        t = (t === "dark") ? "dark" : "light";
        try { localStorage.setItem(KEY, t); } catch(e) {}
        setCookie(KEY, t);
        applyTheme(t);
      }

      // expose globals (works even if helper.js missing/cached)
      window.wguiSetTheme = setTheme;
      window.wguiToggleTheme = function(){
        var cur = readTheme();
        setTheme(cur === "dark" ? "light" : "dark");
      };

      // apply as EARLY as possible
      var t0 = readTheme();
      applyTheme(t0);

      // ensure body sync
      document.addEventListener("DOMContentLoaded", function(){
        applyTheme(readTheme());
      }, { once:true });
    })();
    </script>
<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WireGuard UI</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="icon" href="{{.basePath}}/favicon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{{.basePath}}/static/plugins/fontawesome-free/css/all.min.css">
    <!-- Ionicons -->
    <!-- icheck bootstrap -->
    <link rel="stylesheet" href="{{.basePath}}/static/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="{{.basePath}}/static/dist/css/adminlte.min.css">
    <style id="wgui-system-font">
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    </style>

<link rel="stylesheet" href="{{.basePath}}/static/custom/css/wgui-theme.css?v={{.version}}">
</head>

<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="https://github.com/ngoduykhanh/wireguard-ui">WireGuard UI</a>
        </div>
        <!-- /.login-logo -->
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Войдите, чтобы продолжить</p>
                <form action="" method="post">
                    <div class="input-group mb-3">
                        <input id="username" type="text" class="form-control" placeholder="Логин">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input id="password" type="password" class="form-control" placeholder="Пароль">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-8">
                            <div class="icheck-primary">
                                <input type="checkbox" id="remember">
                                <label for="remember">
                                    Запомнить меня
                                </label>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-4">
                            <button id="btn_login" type="submit" class="btn btn-primary btn-block">Войти</button>
                        </div>
                        <!-- /.col -->
                    </div>
                </form>
                <div class="text-center mb-3">
                    <p id="message"></p>
                </div>
            </div>
            <!-- /.login-card-body -->
        </div>
    </div>
    <!-- /.login-box -->
    <!-- jQuery -->
    <script src="{{.basePath}}/static/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="{{.basePath}}/static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE App -->
    <script src="{{.basePath}}/static/dist/js/adminlte.min.js"></script>
</body>
<script>
    function redirectNext() {
        const urlParams = new URLSearchParams(window.location.search);
        const nextURL = urlParams.get('next');
        if (nextURL && /(?:^\/[a-zA-Z_])|(?:^\/$)/.test(nextURL.trim())) {
            window.location.href = nextURL;
        } else {
            window.location.href = '{{.basePath}}/status';
        } 
    }
</script>
<script>
    $(document).ready(function () {
        $('form').on('submit', function(e) {
            e.preventDefault();
            $("#btn_login").trigger('click');
        });

        $("#btn_login").click(function () {
            const username = $("#username").val();
            const password = $("#password").val();
            let rememberMe = false;
            if ($("#remember").is(':checked')){
                rememberMe = true;
            }
            const data = {"username": username, "password": password, "rememberMe": rememberMe}

            $.ajax({
                cache: false,
                method: 'POST',
                url: '{{.basePath}}/login',
                dataType: 'json',
                contentType: "application/json",
                data: JSON.stringify(data),
                success: function(data) {
                    document.getElementById("message").innerHTML = `<p style="color:green">${data['message']}</p>`;
                    // redirect after logging in successfully
                    redirectNext();
                },
                error: function(jqXHR, exception) {
                    const responseJson = jQuery.parseJSON(jqXHR.responseText);
                    document.getElementById("message").innerHTML = `<p style="color:#ff0000">${responseJson['message']}</p>`;
                }
            });
        });
    });
</script>
</html>
